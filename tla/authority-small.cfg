\* Reduced model for machines where the full authority.cfg thrashes:
\* 2 capability ids (still exercises mint parent/child, double-consume,
\* revocation), tighter time bounds. Exhausts in minutes.
INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoDoubleConsume
INVARIANT AttenuationMonotonic
INVARIANT RevokedNeverConsumed
INVARIANT BudgetNeverNegative
INVARIANT HolderBindingPreserved
INVARIANT ExpiryHonored

CONSTANT Ids      = {"c1", "c2"}
CONSTANT Effects  = {"e1", "e2"}
CONSTANT Holders  = {"h1", "h2"}
CONSTANT Digests  = {"d1", "d2"}
CONSTANT NoId      = "NOID"
CONSTANT NoHolder  = "NOHOLDER"
CONSTANT NoDigest  = "NODIGEST"
CONSTANT MaxBudget = 1
CONSTANT MaxClock  = 2
CONSTANT MaxStale  = 1
CONSTANT MaxNonce  = 1
CONSTANT MaxEpoch  = 2
