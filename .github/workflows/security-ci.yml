# Security-focused CI: mutation testing and TLC model checking.
#
# These jobs are slower and more exploratory than ci.yml's test matrix:
#   * mutation: mutmut on the two security-critical modules. Informational
#     until the kill-rate baseline is calibrated (continue-on-error).
#   * tlc: exhaustive TLC check of the 2-id TLA+ model (tla/authority-small.cfg).
#     Must pass: a TLC invariant violation is a spec or implementation bug.

name: security-ci

on:
  push:
    branches: [anchor-v1]
  pull_request:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation testing (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Informational until the kill-rate baseline is calibrated. A surviving
    # mutant indicates a weak test, not broken code -- never block merges.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies + mutmut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1 mutmut==3.8.0

      - name: Configure mutmut scope
        # Scope to the two security-critical modules. Per-mutant test runs
        # use only the directly relevant test file to stay in the timeout.
        # (setup.cfg is ephemeral: the runner workspace is discarded.)
        run: |
          cat > setup.cfg <<'EOF'
          [mutmut]
          source_paths =
              src/anchor_v1/authority.py
              src/anchor_v1/store.py
          pytest_add_cli_args =
              -q
          pytest_add_cli_args_test_selection =
              tests/test_authority.py
          EOF

      - name: Run mutmut
        run: |
          # 25m hard cap inside the 35m job timeout. Survivors/timeout are
          # informational (see continue-on-error above).
          timeout 25m python -m mutmut run || echo "::warning::mutmut timed out or reported survivors (informational)"

  tlc:
    name: TLC model checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Java
        # ubuntu-latest ships a Temurin JDK; TLC needs Java 11+.
        run: java -version

      - name: Download tla2tools
        # Pinned to the version recorded in tla/README.md run notes.
        run: |
          curl -sSL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          ls -la /tmp/tla2tools.jar

      - name: Run TLC (2-id model)
        # The reduced model from tla/README.md: exhausts in ~6 min on 2 cores,
        # all 7 invariants hold. The full 3-id model needs symmetry reduction
        # or a bigger machine (see tla/README.md run notes). This job FAILS
        # on any invariant violation -- that is a real bug, not flakiness.
        run: |
          cd tla
          java -XX:+UseParallelGC -Xmx4g -jar /tmp/tla2tools.jar \
            -config authority-small.cfg authority.tla
