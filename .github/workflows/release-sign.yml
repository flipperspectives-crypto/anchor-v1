name: release-sign

# Keyless Sigstore signing of release artifacts (see docs/SIGSTORE.md).
# Trigger manually from the Actions tab after a release tag exists.
# Identity: the repo's GitHub Actions OIDC identity (Fulcio + Rekor, no keys).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and sign (must already exist)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write   # attach signed assets to the GitHub release
  id-token: write   # Sigstore keyless OIDC

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Hash release files
        run: |
          cd dist
          sha256sum anchor_v1-*.tar.gz anchor_v1-*.whl > SHA256SUMS
          sha256sum "$GITHUB_WORKSPACE/docs/SBOM.md" \
                   "$GITHUB_WORKSPACE/docs/SPEC.md" \
                   "$GITHUB_WORKSPACE/docs/THREAT_MODEL.md" >> SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Keyless-sign hashes with Sigstore
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify bundle and hashes
        run: |
          cd dist
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/flipperspectives-crypto/anchor-v1/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attach signed assets to the release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/anchor_v1-*.tar.gz
            dist/anchor_v1-*.whl
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
