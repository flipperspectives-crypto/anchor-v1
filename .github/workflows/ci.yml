name: ci

on:
  push:
    branches: [anchor-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        # Bash on all platforms: the floor check uses POSIX shell constructs.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Floors live in pyproject.toml. These three pins match docs/SBOM.md.
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1

      - name: Collected-test floor
        run: |
          n=$(python -m pytest --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          test "$n" -ge 1044 || { echo "test count regression: ${n:-missing} < 1044"; exit 1; }

      - name: Pytest
        run: python -m pytest -q

  adversary:
    name: adversary harness (attack tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1

      - name: Adversary tests (verbose)
        # The red-team / bypass-attempt suite: every test_attack_* test.
        # Verbose so a failure shows exactly which attack succeeded.
        run: python -m pytest -v -k "test_attack"
