name: ci

on:
  push:
    branches: [anchor-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Floors live in pyproject.toml. These three pins match docs/SBOM.md.
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1

      - name: Collected-test floor
        run: |
          n=$(python -m pytest --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          test "$n" -ge 1044 || { echo "test count regression: ${n:-missing} < 1044"; exit 1; }

      - name: Pytest
        run: python -m pytest -q
