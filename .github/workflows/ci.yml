name: ci

on:
  push:
    branches: [anchor-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        # Bash on all platforms: the floor check uses POSIX shell constructs.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Floors live in pyproject.toml. These three pins match docs/SBOM.md.
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1

      - name: Collected-test floor
        run: |
          n=$(python -m pytest --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+')
          test "$n" -ge 1044 || { echo "test count regression: ${n:-missing} < 1044"; exit 1; }

      - name: Pytest
        run: python -m pytest -q

  pg-linearizability:
    name: pg linearizability (postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Same pins as the test job (match docs/SBOM.md); psycopg[binary]
      # is unpinned, matching how the PoC was validated locally.
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1 "psycopg[binary]"

      - name: Linearizability tests (real PostgreSQL)
        # ANCHOR_PG_DSN is what un-skips these tests; each test creates
        # and drops its own database as the postgres superuser.
        env:
          ANCHOR_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -v tests/test_pg_linearizability.py

  adversary:
    name: adversary harness (attack tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cryptography==50.0.1 pydantic==2.13.5 pytest==9.1.1

      - name: Adversary tests (verbose)
        # The red-team / bypass-attempt suite: every test_attack_* test.
        # Verbose so a failure shows exactly which attack succeeded.
        run: python -m pytest -v -k "test_attack"
