[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-v1"
version = "1.0.0a0"
description = "ANCHOR v1 — constitutional governor for AI agents (second generation)"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
